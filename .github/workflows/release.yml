name: Build Windows wheel (py-rust-stemmers 0.1.8, Python 3.15)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git tag or ref to build"
        default: "v0.1.8"
        required: true
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PACKAGE_NAME: py-rust-stemmers
  BUILD_REF: ${{ inputs.ref || 'v0.1.8' }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: qdrant/py-rust-stemmers  # your fork has no v0.1.8 tag; remove this line to build from the fork instead
          ref: ${{ env.BUILD_REF }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.15'

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          args: --release --out dist
          maturin-version: "v1.15.0"

      - name: Validate wheel ZIPs
        run: python .github/scripts/validate_wheels.py  # remove if this ref doesn't have the script

      - name: Install built wheel
        shell: bash
        run: |
          python -m pip install pytest
          python -m pip install --no-index --find-links dist/ --force-reinstall ${{ env.PACKAGE_NAME }}

      - name: Test built wheel
        shell: bash
        run: python -m pytest tests/

      - name: Upload wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: py_rust_stemmers-0.1.8-cp315-windows-x86_64
          path: dist
